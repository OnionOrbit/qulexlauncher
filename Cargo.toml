[workspace]
members = [
    "crates/ql_core",
    "crates/ql_instances",
    "crates/ql_mod_manager",
    "crates/ql_servers",
    "crates/ql_packager",
    # Binaries
    "quantum_launcher",
    "tests",
    # Utility Libraries
    "crates/ql_java_handler",
    "crates/ezshortcut",
]
default-members = ["quantum_launcher"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
dirs = "6"

sysinfo = "0.36.*"
reqwest = { version = "0.13.*", features = ["json", "stream", "query", "form"] }

tokio = { version = "1", features = ["fs", "macros", "process", "rt", "rt-multi-thread"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
cfg-if = "1"

owo-colors = "4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rfd = { version = "0.16.*", default-features = false, features = [
    "xdg-portal",
    "wayland",
    "tokio"
] }
clap = { version = "4", features = ["help", "derive"] }

zip = { version = "=7.2", default-features = false, features = ["deflate"] } # MSRV

walkdir = "2.3"
image = { version = "0.24", default-features = false, features = [
    # Web formats are enough
    #"avif",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
tempfile = "3"
regex = "1"

[profile.dev]
# Faster iteration while still catching misuse; incremental for faster rebuilds
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
# Cargo profile tuning: https://doc.rust-lang.org/cargo/reference/profiles.html
# Thin LTO + one codegen unit trade a little link time for a faster, smaller binary.
# `panic` is intentionally left at the default (unwind) so tests and embedders keep working.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false

[profile.release-test]
inherits = "release"
opt-level = "s"

[profile.release-ql]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

# Shared lints: https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section
# Members opt in with `[lints] workspace = true`. Kept to `all` + `perf` (not
# pedantic/nursery) so `cargo clippy` stays signal-rich without flooding legacy code.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Intentional patterns in this codebase (see also crate-level `allow`s).
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
zombie_processes = "allow"
